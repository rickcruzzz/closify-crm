name: Deploy com auditoria

# Builda um preview a partir de CADA push em `main`, roda a auditoria de
# segurança contra ELE, e avisa se passou ou não — a promoção final para
# produção fica com o dono, um clique no painel da Vercel.
#
# Por que a promoção não é automática: `POST /v10/projects/.../promote` é
# recurso do plano Pro/Enterprise da Vercel (a doc oficial já diz isso pra
# `vercel rollback`, e o mesmo mecanismo move o alias de produção). O projeto
# está no Hobby (grátis) — confirmado tentando promover 2 deployments READY
# distintos, os dois voltaram 422 genérico da API, e o padrão bate com as
# outras funções Pro-only visíveis no próprio painel (Rolling Releases,
# build Elastic/Turbo). Ver "Vercel Pro" em docs/estado-atual.md.
#
# O que o gate garante mesmo sem o passo automático: nada entra em produção
# SEM primeiro passar pela auditoria — porque quem decide promover só vê o
# link depois que este workflow já rodou e (se passou) publicou o resultado.
#
# Pré-requisito manual (o dono precisa fazer, sem acesso ao painel daqui):
# gerar VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID e colar como Secrets
# do repositório, e desligar o deploy automático da Vercel pra `main`
# (Project Settings → Git → Ignored Build Step), sem isso, a Vercel deploya
# em paralelo e este gate não impede nada de verdade. Ver docs/estado-atual.md.
#
# Toda chamada à Vercel aqui é API REST direta (curl), não `vercel` CLI. O
# CLI resolve o token via `vercel whoami`, e esse comando devolveu
# "Error: User not found" para um token que a própria API REST aceitava com
# 200 — reproduzido e confirmado 19/08/2026, com dois tokens gerados em
# escopos diferentes (time e conta pessoal), mesmo sintoma nos dois. É bug de
# resolução de usuário do CLI (`vercel@59.1.4`, Node 20/24), não do token.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-e-testar:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
      dpl_id: ${{ steps.deploy.outputs.dpl_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagens de código
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build

      # A API REST direto, e não `vercel pull`/`vercel build`/`vercel deploy`
      # do CLI. O CLI resolve o token via `whoami`, que devolve "User not
      # found" para este token mesmo ele sendo válido — confirmado batendo o
      # MESMO token contra `GET /v9/projects/...` (200, dados completos do
      # projeto). É bug de resolução de usuário do CLI, não do token; a API
      # REST não tem esse passo intermediário e funciona com o token como
      # está, sem precisar gerar outro.
      - name: Criar Deployment de preview via API REST
        id: deploy
        run: |
          curl -sf -X POST "https://api.vercel.com/v13/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "closify-crm-dr3t",
              "project": "${{ secrets.VERCEL_PROJECT_ID }}",
              "target": "staging",
              "gitSource": {
                "type": "github",
                "repoId": "1318803572",
                "ref": "${{ github.sha }}"
              }
            }' > /tmp/deployment.json
          cat /tmp/deployment.json
          node scripts/ci/publicar-saida-do-deploy.mjs /tmp/deployment.json "$GITHUB_OUTPUT"

      # A criação do deployment acima só ENFILEIRA o build; ele roda no lado
      # da Vercel, não aqui. Sem esperar, a auditoria bateria numa URL ainda
      # 404. `sleep` fixo é o que a própria Vercel recomenda para consumidores
      # simples da API sem webhook de status configurado.
      - name: Esperar o build do preview terminar
        run: sleep 90

      - name: Instalar navegador do Playwright
        run: npx playwright install chromium --with-deps

      - name: Auditoria de segurança contra o preview
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.deploy.outputs.preview_url }}

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  avisar-pronto-pra-promover:
    needs: build-e-testar
    runs-on: ubuntu-latest
    # Só chega aqui se `build-e-testar` passou inteiro, inclusive a auditoria
    # de segurança. É este `needs` que faz o gate valer: sem passar aqui,
    # nenhum link de promoção é publicado.
    steps:
      - name: Resumo — pronto para promover
        run: |
          echo "## Build e auditoria passaram ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview testado: ${{ needs.build-e-testar.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Promoção final é manual (plano Hobby da Vercel não expõe promote via API — ver comentário no topo deste arquivo):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Abra https://vercel.com/ricks-projects-1e819723/closify-crm-dr3t/${{ needs.build-e-testar.outputs.dpl_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Clique em **Promote to Production**" >> "$GITHUB_STEP_SUMMARY"
