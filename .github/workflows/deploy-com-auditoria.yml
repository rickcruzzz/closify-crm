name: Deploy com auditoria

# Substitui o deploy automático nativo da Vercel: aqui o build vira um
# preview primeiro, a auditoria de segurança roda contra ELE, e só então
# esse mesmo deployment é promovido pra produção. Se a auditoria falhar, o
# workflow para antes do passo de promoção, o domínio de produção continua
# apontando pro deployment anterior, que já passou.
#
# Pré-requisito manual (o dono precisa fazer, sem acesso ao painel daqui):
# gerar VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID e colar como Secrets
# do repositório, e desligar o deploy automático da Vercel pra `main`
# (Project Settings → Git), sem isso, a Vercel deploya em paralelo e este
# gate não impede nada de verdade. Ver docs/estado-atual.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-e-testar:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagens de código
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Vincular projeto Vercel
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build para deploy
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy de preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "URL do preview: $url"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Instalar navegador do Playwright
        run: npx playwright install chromium --with-deps

      - name: Auditoria de segurança contra o preview
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.deploy.outputs.preview_url }}

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  promover-producao:
    needs: build-e-testar
    runs-on: ubuntu-latest
    # Só chega aqui se `build-e-testar` passou inteiro, inclusive a
    # auditoria de segurança. É este `needs` que faz o gate valer.
    steps:
      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Promover o deployment já testado para produção
        run: vercel promote ${{ needs.build-e-testar.outputs.preview_url }} --token=${{ secrets.VERCEL_TOKEN }}
